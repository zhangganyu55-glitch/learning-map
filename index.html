var META_KEYS = ['title', 'label', 'stage', 'checkpoint'];
var idSeq = 0;

function newId(prefix) {
  idSeq += 1;
  return prefix + '-' + Date.now().toString(36) + '-' + idSeq;
}

function clone(v) {
  return JSON.parse(JSON.stringify(v));
}

function createInitialState() {
  return { version: 1, projectTitle: '学习地图', weeks: clone(SEED_WEEKS), checkins: [] };
}

function findWeek(state, weekId) {
  return state.weeks.find(function (w) { return w.id === weekId; }) || null;
}

function mapWeek(state, weekId, fn) {
  return Object.assign({}, state, {
    weeks: state.weeks.map(function (w) { return w.id === weekId ? fn(w) : w; })
  });
}

function toggleTask(state, weekId, taskId) {
  return mapWeek(state, weekId, function (w) {
    return Object.assign({}, w, {
      tasks: w.tasks.map(function (t) { return t.id === taskId ? Object.assign({}, t, { done: !t.done }) : t; })
    });
  });
}

function addTask(state, weekId, text) {
  var t = String(text == null ? '' : text).trim();
  if (!t) return state;
  return mapWeek(state, weekId, function (w) {
    return Object.assign({}, w, {
      tasks: w.tasks.concat([{ id: newId('t'), text: t, kind: 'custom', done: false }])
    });
  });
}

function updateTaskText(state, weekId, taskId, text) {
  var t = String(text == null ? '' : text).trim();
  if (!t) return state;
  return mapWeek(state, weekId, function (w) {
    return Object.assign({}, w, {
      tasks: w.tasks.map(function (x) { return x.id === taskId ? Object.assign({}, x, { text: t }) : x; })
    });
  });
}

function deleteTask(state, weekId, taskId) {
  return mapWeek(state, weekId, function (w) {
    return Object.assign({}, w, {
      tasks: w.tasks.filter(function (x) { return x.id !== taskId; })
    });
  });
}

function moveTask(state, weekId, taskId, delta) {
  return mapWeek(state, weekId, function (w) {
    var i = w.tasks.findIndex(function (x) { return x.id === taskId; });
    var j = i + delta;
    if (i < 0 || j < 0 || j >= w.tasks.length) return w;
    var tasks = w.tasks.slice();
    var tmp = tasks[i];
    tasks[i] = tasks[j];
    tasks[j] = tmp;
    return Object.assign({}, w, { tasks: tasks });
  });
}

function addWeek(state) {
  var lastNo = state.weeks.reduce(function (m, w) { return Math.max(m, w.noEnd); }, 0);
  var no = lastNo + 1;
  var week = {
    id: newId('w'), no: no, noEnd: no, label: '', title: '新的一周',
    stage: '', checkpoint: null, note: '', tasks: []
  };
  return Object.assign({}, state, { weeks: state.weeks.concat([week]) });
}

function removeWeek(state, weekId) {
  if (state.weeks.length <= 1) return state;
  return Object.assign({}, state, {
    weeks: state.weeks.filter(function (w) { return w.id !== weekId; })
  });
}

function setWeekNote(state, weekId, text) {
  return mapWeek(state, weekId, function (w) {
    return Object.assign({}, w, { note: String(text == null ? '' : text) });
  });
}

function updateWeekMeta(state, weekId, patch) {
  return mapWeek(state, weekId, function (w) {
    var next = Object.assign({}, w);
    META_KEYS.forEach(function (k) {
      if (patch && Object.prototype.hasOwnProperty.call(patch, k)) next[k] = patch[k];
    });
    return next;
  });
}

function weekProgress(week) {
  var total = week.tasks.length;
  var done = week.tasks.filter(function (t) { return t.done; }).length;
  return { done: done, total: total, ratio: total ? done / total : 0 };
}

function currentWeek(state) {
  for (var i = 0; i < state.weeks.length; i += 1) {
    var p = weekProgress(state.weeks[i]);
    if (p.total === 0 || p.done < p.total) return state.weeks[i];
  }
  return state.weeks[state.weeks.length - 1] || null;
}

function overallProgress(state) {
  var done = 0, total = 0, weeksDone = 0, weeksTotal = 0;
  state.weeks.forEach(function (w) {
    var p = weekProgress(w);
    done += p.done;
    total += p.total;
    weeksTotal += w.noEnd - w.no + 1;
    if (p.total > 0 && p.done === p.total) weeksDone += w.noEnd - w.no + 1;
  });
  var cur = currentWeek(state);
  return {
    done: done, total: total, ratio: total ? done / total : 0,
    weeksDone: weeksDone, weeksTotal: weeksTotal,
    currentWeekId: cur ? cur.id : null, currentWeekNo: cur ? cur.no : null
  };
}

function toggleCheckin(state, dateISO, on) {
  var has = state.checkins.indexOf(dateISO) !== -1;
  if (on === false) {
    return has ? Object.assign({}, state, {
      checkins: state.checkins.filter(function (d) { return d !== dateISO; })
    }) : state;
  }
  if (has) return state;
  return Object.assign({}, state, {
    checkins: state.checkins.concat([dateISO]).sort()
  });
}

function shiftDate(dateISO, days) {
  var d = new Date(dateISO + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function streak(state, todayISO) {
  var set = {};
  state.checkins.forEach(function (d) { set[d] = true; });
  var cursor = set[todayISO] ? todayISO : shiftDate(todayISO, -1);
  var n = 0;
  while (set[cursor]) {
    n += 1;
    cursor = shiftDate(cursor, -1);
  }
  return n;
}

function exportJSON(state) {
  return JSON.stringify(state, null, 2);
}

function validateState(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('文件内容不是一个对象');
  if (!Array.isArray(o.weeks) || o.weeks.length === 0) throw new Error('缺少 weeks 数组');
  var weeks = o.weeks.map(function (w, i) {
    if (!w || typeof w !== 'object') throw new Error('第 ' + (i + 1) + ' 张周卡片不是对象');
    if (typeof w.id !== 'string' || !w.id) throw new Error('第 ' + (i + 1) + ' 张周卡片缺少 id');
    if (typeof w.title !== 'string') throw new Error('第 ' + (i + 1) + ' 张周卡片缺少 title');
    if (!Array.isArray(w.tasks)) throw new Error('第 ' + (i + 1) + ' 张周卡片缺少 tasks');
    var no = typeof w.no === 'number' && isFinite(w.no) ? w.no : i + 1;
    var noEnd = typeof w.noEnd === 'number' && isFinite(w.noEnd) && w.noEnd >= no ? w.noEnd : no;
    return {
      id: w.id,
      no: no,
      noEnd: noEnd,
      label: typeof w.label === 'string' ? w.label : '',
      title: w.title,
      stage: typeof w.stage === 'string' ? w.stage : '',
      checkpoint: typeof w.checkpoint === 'string' ? w.checkpoint : null,
      note: typeof w.note === 'string' ? w.note : '',
      tasks: w.tasks.map(function (t, j) {
        if (!t || typeof t.id !== 'string' || typeof t.text !== 'string') {
          throw new Error('第 ' + (i + 1) + ' 张周卡片第 ' + (j + 1) + ' 条任务无效');
        }
        return {
          id: t.id,
          text: t.text,
          kind: t.kind === 'learn' || t.kind === 'deliverable' ? t.kind : 'custom',
          done: !!t.done
        };
      })
    };
  });
  return {
    version: 1,
    projectTitle: typeof o.projectTitle === 'string' && o.projectTitle ? o.projectTitle : '学习地图',
    weeks: weeks,
    checkins: Array.isArray(o.checkins) ? o.checkins.filter(function (d) { return typeof d === 'string'; }) : []
  };
}

function importJSON(text) {
  var parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error('不是合法的 JSON：' + e.message);
  }
  return validateState(parsed);
}
