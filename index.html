<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>学习地图</title>
<style>
:root{
  --paper:#f7f4ef;
  --card:#ffffff;
  --line:#e7e1d8;
  --line-soft:#f0ebe3;
  --ink:#2b2823;
  --ink-2:#8a8175;
  --ink-3:#b3aa9c;
  --sand:#c8a87c;
  --sand-soft:#efe4d3;
  --sand-ink:#7a6242;
  --r:22px;
  --r-sm:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--paper);color:var(--ink);
  font:15px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:26px 20px 60px}

/* ---------- 月份头 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.month-big{font-size:32px;font-weight:600;letter-spacing:.5px;line-height:1}
.month-big small{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:8px;letter-spacing:0}
.nav{display:flex;align-items:center;gap:4px}
.nav-label{font-size:13px;color:var(--ink-2);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.nav-btn{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);transition:background .18s,color .18s;
}
.nav-btn:hover{background:#eee7dd;color:var(--ink)}

/* ---------- 日历 ---------- */
.cal{
  background:var(--card);border-radius:var(--r);padding:14px 12px 16px;
  box-shadow:0 1px 2px rgba(43,40,35,.04),0 12px 30px -24px rgba(43,40,35,.28);
}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.dow span{text-align:center;font-size:12px;color:var(--ink-3);padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{
  position:relative;aspect-ratio:1/1;border-radius:14px;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);
  transition:background .18s var(--ease),color .18s;
}
.cell:hover{background:var(--line-soft)}
.cell.out{color:var(--ink-3);opacity:.5}
.cell.today{background:var(--sand-soft);color:var(--sand-ink);font-weight:600}
.cell.sel{outline:1.5px solid var(--sand);outline-offset:-1px}
.cell.today.sel{background:var(--sand-soft)}
.cellsel{position:absolute;bottom:7px;display:flex;gap:3px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.pending{background:var(--sand);opacity:.45}
.dot.done{background:var(--sand)}
.cell.out .dot{opacity:.3}

/* ---------- 当天 ---------- */
.day-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:30px 2px 12px;
}
.day-title{font-size:19px;font-weight:600}
.day-title small{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:8px}
.day-num{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:14px;padding:8px 2px 4px}

.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:13px 14px;transition:border-color .18s,opacity .2s;
}
.row:hover{border-color:var(--line)}
.row.done{opacity:.55}
.tick{
  width:22px;height:22px;margin-top:1px;border-radius:50%;
  border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;
  padding:0;transition:background .2s var(--ease),border-color .2s,transform .12s;
}
.tick:hover{border-color:var(--sand);transform:scale(1.06)}
.tick::after{
  content:"";width:9px;height:5px;margin-top:-3px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) scale(.35);opacity:0;transition:opacity .18s,transform .22s var(--ease);
}
.row.done .tick{background:var(--sand);border-color:var(--sand)}
.row.done .tick::after{opacity:1;transform:rotate(-45deg) scale(1)}
.row-text{word-break:break-word;transition:color .2s}
.row.done .row-text{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.tag{
  display:inline-block;font-size:11px;color:var(--sand-ink);background:var(--sand-soft);
  padding:1px 7px;border-radius:999px;margin-bottom:4px;
}
.tools{display:flex;gap:2px;opacity:0;transition:opacity .18s}
.row:hover .tools,.row:focus-within .tools{opacity:1}
.tool{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:12px;transition:background .16s,color .16s}
.tool:hover{background:#f3efe8;color:var(--ink)}
.tool.del:hover{background:#fbeeea;color:#b4634a}
.date-input{border:1px solid var(--line);border-radius:10px;padding:3px 6px;font-size:12px;background:#fff;width:132px}

.pill{
  width:100%;margin-top:14px;padding:13px;border-radius:999px;
  background:var(--sand);color:#fff;font-weight:600;font-size:15px;
  transition:filter .18s,transform .12s;
}
.pill:hover{filter:brightness(1.04)}
.pill:active{transform:scale(.99)}
.add-box{margin-top:12px;display:none;gap:8px}
.add-box.on{display:flex}
.add-box input,.edit-input{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:11px 16px;transition:border-color .18s;
}
.add-box input:focus,.edit-input:focus{outline:none;border-color:var(--sand)}
.edit-input{border-radius:10px;padding:4px 9px}

.note-block{margin-top:22px}
.note-block label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;padding-left:2px}
.note{
  width:100%;min-height:64px;resize:vertical;line-height:1.55;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:12px 14px;transition:border-color .18s;
}
.note:focus{outline:none;border-color:var(--sand)}
.note::placeholder{color:var(--ink-3)}

.foot{margin-top:34px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ghost{font-size:13px;color:var(--ink-2);padding:7px 12px;border-radius:999px;transition:background .18s,color .18s}
.ghost:hover{background:#eee7dd;color:var(--ink)}
.ghost.armed{background:#fbeee1;color:#a4733c}
.spacer{flex:1}
.hint{font-size:12px;color:var(--ink-3)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:40;
  display:flex;align-items:center;gap:12px;max-width:min(520px,92vw);
  padding:12px 16px;border-radius:999px;font-size:13px;
  background:#2b2823;color:#fff8ef;
  box-shadow:0 18px 40px -18px rgba(43,40,35,.6);
  opacity:0;pointer-events:none;transition:opacity .26s var(--ease),transform .26s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--sand);font-weight:600;white-space:nowrap;padding:2px 6px;border-radius:999px}

@media (max-width:420px){
  .wrap{padding:20px 14px 50px}
  .month-big{font-size:27px}
  .cell{border-radius:11px;font-size:14px}
  .row{grid-template-columns:24px 1fr;gap:10px}
  .tools{grid-column:2;opacity:1;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="month-big" id="monthBig">9月<small id="monthSub">2026年</small></div>
    <div class="nav">
      <button class="nav-btn" data-act="prevMonth" aria-label="上一个月">‹</button>
      <span class="nav-label" id="navLabel">2026年9月</span>
      <button class="nav-btn" data-act="nextMonth" aria-label="下一个月">›</button>
      <button class="nav-btn" data-act="today" aria-label="回到今天" title="回到今天">·</button>
    </div>
  </div>

  <div class="cal">
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="day-head">
    <div class="day-title" id="dayTitle">—</div>
    <div class="day-num" id="dayNum"></div>
  </div>
  <div class="rows" id="rows"></div>
  <button class="pill" id="addPill" data-act="showAdd">＋ 加一件事</button>
  <div class="add-box" id="addBox">
    <input type="text" id="addInput" placeholder="这天要做什么？回车确认">
  </div>

  <div class="note-block">
    <label for="note">今天的卡点</label>
    <textarea class="note" id="note" placeholder="卡在哪？不知道怎么写也行"></textarea>
  </div>

  <div class="foot">
    <button class="ghost" data-act="export">导出备份</button>
    <button class="ghost" data-act="import">导入备份</button>
    <button class="ghost" data-act="reset" id="resetBtn">重置为预置清单</button>
    <span class="spacer"></span>
    <span class="hint">双击文字可改</span>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== CORE ===== */
/* 纯逻辑区：不碰 DOM、不碰存储。测试从 index.html 里抽出这一段直接执行。 */

var SEED_ITEMS = [
  { text: '变量、数据类型、console.log、if、for', kind: 'learn' },

  { text: '解构、模板字符串', kind: 'learn' },

  { text: '箭头函数、回调、高阶函数（闭包理解即可，不要求精通）', kind: 'learn' },
  { text: 'import / export，把代码拆成多个文件', kind: 'learn' },

  { text: '一个能发给任何人的链接（手机也能打开）', kind: 'deliverable' },
  { text: 'querySelector、addEventListener、表单处理', kind: 'learn' },
  { text: '一个交互式小工具（番茄钟、待办清单、单位换算任选）', kind: 'deliverable' },
  { text: 'localStorage、数据与界面同步', kind: 'learn' },

  { text: '开始想寒假要做的东西（只做想法，不动手）', kind: 'learn' },

  { text: '选一个你自己真的会每天打开的东西（不要做待办清单和博客）', kind: 'learn' },
  { text: '先写"什么算做完"，再动手', kind: 'learn' },
  { text: '搭好项目结构，跑通最小可用版本', kind: 'learn' },
  { text: '能跑起来、但功能还很粗糙的雏形', kind: 'deliverable' },
  { text: '补齐核心功能', kind: 'learn' },

  { text: '写 README，说明它做什么、怎么用', kind: 'learn' },
  { text: '注意：2027 年春节在 2 月 6 日，前后约一周效率会很低，提前预留缓冲', kind: 'learn' },
  { text: '一个上线的、你自己写的完整应用', kind: 'deliverable' },
  { text: '用一个周末认真回答那两个问题', kind: 'learn' },
  { text: '对着判断表做决定', kind: 'learn' }
];

var STORAGE_VERSION = 2;
var idSeq = 0;

function newId() {
  idSeq += 1;
  return 't-' + Date.now().toString(36) + '-' + idSeq;
}

function parseISO(iso) {
  var p = String(iso).split('-');
  return new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
}

function toISO(d) {
  return d.toISOString().slice(0, 10);
}

function shiftDate(dateISO, days) {
  var d = parseISO(dateISO);
  d.setUTCDate(d.getUTCDate() + days);
  return toISO(d);
}

function isoOf(year, month, day) {
  return year + '-' + (month < 10 ? '0' : '') + month + '-' + (day < 10 ? '0' : '') + day;
}

function weekdayIndex(dateISO) {
  /* 0 = 周一 …… 6 = 周日 */
  return (parseISO(dateISO).getUTCDay() + 6) % 7;
}

var WEEKDAY_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

function createInitialState(todayISO) {
  var cursor = todayISO || toISO(new Date());
  var tasks = SEED_ITEMS.map(function (item, i) {
    var iso = cursor;
    cursor = shiftDate(cursor, 1);
    return { id: 'seed-' + (i + 1), text: item.text, date: iso, kind: item.kind, done: false };
  });
  return { version: STORAGE_VERSION, projectTitle: '学习地图', tasks: tasks, notes: {}, checkins: [] };
}

function tasksOn(state, dateISO) {
  return state.tasks.filter(function (t) { return t.date === dateISO; });
}

function findTask(state, taskId) {
  return state.tasks.find(function (t) { return t.id === taskId; }) || null;
}

function dayStats(state, dateISO) {
  var list = tasksOn(state, dateISO);
  var done = list.filter(function (t) { return t.done; }).length;
  return { done: done, total: list.length, ratio: list.length ? done / list.length : 0, allDone: list.length > 0 && done === list.length };
}

function monthStats(state, year, month) {
  var prefix = year + '-' + (month < 10 ? '0' : '') + month;
  var list = state.tasks.filter(function (t) { return t.date.slice(0, 7) === prefix; });
  var done = list.filter(function (t) { return t.done; }).length;
  return { done: done, total: list.length, ratio: list.length ? done / list.length : 0 };
}

function mapTasks(state, fn) {
  return Object.assign({}, state, { tasks: state.tasks.map(fn) });
}

function toggleTask(state, taskId) {
  return mapTasks(state, function (t) {
    return t.id === taskId ? Object.assign({}, t, { done: !t.done }) : t;
  });
}

function addTask(state, dateISO, text) {
  var v = String(text == null ? '' : text).trim();
  if (!v) return state;
  return Object.assign({}, state, {
    tasks: state.tasks.concat([{ id: newId(), text: v, date: dateISO, kind: 'custom', done: false }])
  });
}

function updateTaskText(state, taskId, text) {
  var v = String(text == null ? '' : text).trim();
  if (!v) return state;
  return mapTasks(state, function (t) {
    return t.id === taskId ? Object.assign({}, t, { text: v }) : t;
  });
}

function deleteTask(state, taskId) {
  return Object.assign({}, state, {
    tasks: state.tasks.filter(function (t) { return t.id !== taskId; })
  });
}

function restoreTask(state, task, index) {
  if (!task || findTask(state, task.id)) return state;
  var tasks = state.tasks.slice();
  var at = typeof index === 'number' && index >= 0 && index <= tasks.length ? index : tasks.length;
  tasks.splice(at, 0, task);
  return Object.assign({}, state, { tasks: tasks });
}

function moveTaskToDate(state, taskId, dateISO) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateISO))) return state;
  return mapTasks(state, function (t) {
    return t.id === taskId ? Object.assign({}, t, { date: dateISO }) : t;
  });
}

function reorderTask(state, taskId, delta) {
  var task = findTask(state, taskId);
  if (!task) return state;
  var list = tasksOn(state, task.date);
  var i = list.findIndex(function (t) { return t.id === taskId; });
  var j = i + delta;
  if (i < 0 || j < 0 || j >= list.length) return state;
  var ia = state.tasks.indexOf(list[i]);
  var ib = state.tasks.indexOf(list[j]);
  var tasks = state.tasks.slice();
  tasks[ia] = list[j];
  tasks[ib] = list[i];
  return Object.assign({}, state, { tasks: tasks });
}

function setNote(state, dateISO, text) {
  var notes = Object.assign({}, state.notes);
  var v = String(text == null ? '' : text);
  if (v) notes[dateISO] = v;
  else delete notes[dateISO];
  return Object.assign({}, state, { notes: notes });
}

function getNote(state, dateISO) {
  return state.notes[dateISO] || '';
}

function monthMatrix(year, month) {
  var firstISO = isoOf(year, month, 1);
  var lead = weekdayIndex(firstISO);
  var startISO = shiftDate(firstISO, -lead);
  var cells = [];
  for (var i = 0; i < 42; i += 1) {
    var iso = shiftDate(startISO, i);
    cells.push({
      iso: iso,
      day: Number(iso.slice(8, 10)),
      inMonth: Number(iso.slice(0, 4)) === year && Number(iso.slice(5, 7)) === month
    });
  }
  return cells;
}

function shiftMonth(year, month, delta) {
  var d = new Date(Date.UTC(year, month - 1 + delta, 1));
  return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1 };
}

function toggleCheckin(state, dateISO, on) {
  var has = state.checkins.indexOf(dateISO) !== -1;
  if (on === false) {
    return has ? Object.assign({}, state, { checkins: state.checkins.filter(function (d) { return d !== dateISO; }) })
      : state;
  }
  if (has) return state;
  return Object.assign({}, state, { checkins: state.checkins.concat([dateISO]).sort() });
}

function streak(state, todayISO) {
  var set = {};
  state.checkins.forEach(function (d) { set[d] = true; });
  var cursor = set[todayISO] ? todayISO : shiftDate(todayISO, -1);
  var n = 0;
  while (set[cursor]) {
    n += 1;
    cursor = shiftDate(cursor, -1);
  }
  return n;
}

function exportJSON(state) {
  return JSON.stringify(state, null, 2);
}

function validateState(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('文件内容不是一个对象');
  if (Array.isArray(o.weeks)) throw new Error('这是旧版（周制）的备份，现在的格式已经换成按日期排了');
  if (!Array.isArray(o.tasks)) throw new Error('缺少 tasks 数组');
  var tasks = o.tasks.map(function (t, i) {
    if (!t || typeof t !== 'object') throw new Error('第 ' + (i + 1) + ' 条任务不是对象');
    if (typeof t.id !== 'string' || !t.id) throw new Error('第 ' + (i + 1) + ' 条任务缺少 id');
    if (typeof t.text !== 'string' || !t.text) throw new Error('第 ' + (i + 1) + ' 条任务缺少文字');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date))) throw new Error('第 ' + (i + 1) + ' 条任务的日期无效');
    return {
      id: t.id,
      text: t.text,
      date: t.date,
      kind: t.kind === 'learn' || t.kind === 'deliverable' ? t.kind : 'custom',
      done: !!t.done
    };
  });
  var notes = {};
  if (o.notes && typeof o.notes === 'object' && !Array.isArray(o.notes)) {
    Object.keys(o.notes).forEach(function (k) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof o.notes[k] === 'string') notes[k] = o.notes[k];
    });
  }
  return {
    version: STORAGE_VERSION,
    projectTitle: typeof o.projectTitle === 'string' && o.projectTitle ? o.projectTitle : '学习地图',
    tasks: tasks,
    notes: notes,
    checkins: Array.isArray(o.checkins) ? o.checkins.filter(function (d) { return typeof d === 'string'; }) : []
  };
}

function importJSON(text) {
  var parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error('不是合法的 JSON：' + e.message);
  }
  return validateState(parsed);
}
/* ===== CORE END ===== */

/* ===== UI ===== */
var STORAGE_KEY = 'learning-map-state-v2';
var TOUCH = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
var state = null;
var storageOK = true;
var view = null;
var selected = null;
var resetArmed = false;
var noteTimer = null;
var addOpen = false;

function $(sel) { return document.querySelector(sel); }
function pad2(n) { return String(n).padStart(2, '0'); }

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function load() {
  var raw = null;
  try {
    raw = window.localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    storageOK = false;
    return { state: createInitialState(todayISO()), message: '这个浏览器不允许本地保存，这次的修改关掉页面就没了。' };
  }
  if (!raw) return { state: createInitialState(todayISO()), message: null };
  try {
    return { state: importJSON(raw), message: null };
  } catch (e) {
    return { state: createInitialState(todayISO()), message: '本地保存的数据读不出来，已回到预置清单。' };
  }
}

function save() {
  if (!storageOK) return;
  try {
    window.localStorage.setItem(STORAGE_KEY, exportJSON(state));
  } catch (e) {
    storageOK = false;
    toast('本地保存失败，这次的修改可能留不下来。');
  }
}

function toast(msg, action) {
  var box = $('#toast');
  box.className = 'toast show';
  box.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  box.appendChild(span);
  if (action) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = action.label;
    b.addEventListener('click', function () { box.className = 'toast'; action.onClick(); });
    box.appendChild(b);
  }
  var close = document.createElement('button');
  close.type = 'button';
  close.textContent = '关闭';
  close.addEventListener('click', function () { box.className = 'toast'; });
  box.appendChild(close);
  window.clearTimeout(toast._t);
  toast._t = window.setTimeout(function () { box.className = 'toast'; }, 6000);
}

function renderGrid() {
  var cells = monthMatrix(view.year, view.month);
  var today = todayISO();
  var rows = '';
  cells.forEach(function (c) {
    var stats = dayStats(state, c.iso);
    var dots = '';
    if (stats.total > 0) {
      dots = '<span class="cellsel"><i class="dot ' + (stats.allDone ? 'done' : 'pending') + '"></i>'
        + (stats.done > 0 && !stats.allDone ? '<i class="dot done"></i>' : '')
        + '</span>';
    }
    rows += '<button type="button" class="cell' + (c.inMonth ? '' : ' out')
      + (c.iso === today ? ' today' : '') + (c.iso === selected ? ' sel' : '') + '"'
      + ' data-date="' + c.iso + '" aria-label="' + c.iso + '">'
      + '<span>' + c.day + '</span>' + dots + '</button>';
  });
  $('#grid').innerHTML = rows;
}

function renderHead() {
  var ms = monthStats(state, view.year, view.month);
  $('#monthBig').innerHTML = view.month + '月<small>' + view.year + '年</small>';
  $('#navLabel').textContent = view.year + '年' + view.month + '月';
  var today = todayISO();
  var ds = dayStats(state, selected);
  var isToday = selected === today;
  var d = parseISO(selected);
  $('#dayTitle').innerHTML = (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日'
    + '<small>' + WEEKDAY_CN[weekdayIndex(selected)] + (isToday ? ' · 今天' : '') + '</small>';
  $('#dayNum').textContent = ds.total
    ? ('当天 ' + ds.done + '/' + ds.total + ' · 本月 ' + ms.done + '/' + ms.total)
    : ('本月 ' + ms.done + '/' + ms.total);
}

function renderRows() {
  var list = tasksOn(state, selected);
  if (!list.length) {
    $('#rows').innerHTML = '<div class="empty">这天还没有安排。点下面的按钮加一件，或者点日历上别的日期。</div>';
    return;
  }
  $('#rows').innerHTML = list.map(function (t) {
    return '<div class="row' + (t.done ? ' done' : '') + '" data-task="' + t.id + '">'
      + '<button type="button" class="tick" role="checkbox" aria-checked="' + (t.done ? 'true' : 'false')
      + '" data-act="toggle" aria-label="勾选：' + esc(t.text) + '"></button>'
      + '<div><div class="row-text" data-edit="task" title="双击修改">' + esc(t.text) + '</div>'
      + (t.kind === 'deliverable' ? '<div class="tag">本周交付物</div>' : '')
      + '</div>'
      + '<div class="tools">'
      + '<button type="button" class="tool" data-act="move" title="换一天" aria-label="换一天">→</button>'
      + '<button type="button" class="tool" data-act="up" aria-label="上移">↑</button>'
      + '<button type="button" class="tool" data-act="down" aria-label="下移">↓</button>'
      + '<button type="button" class="tool del" data-act="del" aria-label="删除">✕</button>'
      + '</div></div>';
  }).join('');
}

function renderNote() {
  var el = $('#note');
  if (document.activeElement !== el) el.value = getNote(state, selected);
}

function renderAll() {
  renderHead();
  renderGrid();
  renderRows();
  renderNote();
  $('#addBox').className = 'add-box' + (addOpen ? ' on' : '');
  $('#addPill').style.display = addOpen ? 'none' : '';
  if (addOpen) $('#addInput').focus();
}

function selectDate(iso, scroll) {
  selected = iso;
  view = { year: Number(iso.slice(0, 4)), month: Number(iso.slice(5, 7)) };
  renderAll();
  if (scroll) {
    var head = document.querySelector('.day-head');
    if (head) head.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function taskRowEl(taskId) {
  return document.querySelector('.row[data-task="' + taskId + '"]');
}

function beginEdit(node) {
  var rowEl = node.closest('.row');
  if (!rowEl) return;
  var taskId = rowEl.dataset.task;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'edit-input';
  input.value = node.textContent;
  node.replaceWith(input);
  input.focus();
  input.select();
  var settled = false;
  function commit() {
    if (settled) return;
    settled = true;
    var v = input.value.trim();
    if (v) {
      state = updateTaskText(state, taskId, v);
      save();
    }
    renderAll();
  }
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') commit();
    else if (e.key === 'Escape') { settled = true; renderAll(); }
  });
  input.addEventListener('blur', commit);
}

function beginMove(taskId, currentDate, rowEl) {
  if (rowEl.querySelector('.date-input')) return;
  var input = document.createElement('input');
  input.type = 'date';
  input.className = 'date-input';
  input.value = currentDate;
  rowEl.appendChild(input);
  input.focus();
  var settled = false;
  function commit() {
    if (settled) return;
    settled = true;
    var v = input.value;
    if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      state = moveTaskToDate(state, taskId, v);
      save();
      toast('已经挪到 ' + v);
    }
    renderAll();
  }
  input.addEventListener('change', commit);
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { settled = true; renderAll(); } });
}

function deleteWithUndo(taskId) {
  var task = findTask(state, taskId);
  if (!task) return;
  var index = state.tasks.indexOf(task);
  state = deleteTask(state, taskId);
  save();
  renderAll();
  toast('已删除一件事', {
    label: '撤销',
    onClick: function () { state = restoreTask(state, task, index); save(); renderAll(); }
  });
}

function onClick(e) {
  var cell = e.target.closest('.cell');
  if (cell) { selectDate(cell.dataset.date, true); return; }

  var rowEl = e.target.closest('.row');
  var actBtn = e.target.closest('[data-act]');
  var act = actBtn ? actBtn.dataset.act : null;

  if (rowEl) {
    var taskId = rowEl.dataset.task;
    var task = findTask(state, taskId);
    if (e.target.closest('[data-edit]')) {
      if (TOUCH) beginEdit(e.target.closest('[data-edit]'));
      return;
    }
    if (act === 'toggle' && task) {
      var nowDone = !task.done;
      state = toggleTask(state, taskId);
      if (nowDone) state = toggleCheckin(state, selected, true);
      save();
      rowEl.classList.toggle('done', nowDone);
      var tick = rowEl.querySelector('.tick');
      if (tick) tick.setAttribute('aria-checked', nowDone ? 'true' : 'false');
      renderHead();
      renderGrid();
      return;
    }
    if (act === 'up' || act === 'down') {
      state = reorderTask(state, taskId, act === 'up' ? -1 : 1);
      save();
      renderRows();
      return;
    }
    if (act === 'del') { deleteWithUndo(taskId); return; }
    if (act === 'move' && task) { beginMove(taskId, task.date, rowEl); return; }
    return;
  }

  if (act === 'showAdd') { addOpen = true; renderAll(); return; }
  if (act === 'prevMonth') { view = shiftMonth(view.year, view.month, -1); renderAll(); return; }
  if (act === 'nextMonth') { view = shiftMonth(view.year, view.month, 1); renderAll(); return; }
  if (act === 'today') { addOpen = false; selectDate(todayISO(), false); return; }
  if (act === 'export') { doExport(); return; }
  if (act === 'import') { $('#fileInput').click(); return; }
  if (act === 'reset') {
    var btn = $('#resetBtn');
    if (!resetArmed) {
      resetArmed = true;
      btn.classList.add('armed');
      btn.textContent = '再点一次确认重置';
      window.setTimeout(function () {
        resetArmed = false;
        btn.classList.remove('armed');
        btn.textContent = '重置为预置清单';
      }, 4000);
      return;
    }
    resetArmed = false;
    btn.classList.remove('armed');
    btn.textContent = '重置为预置清单';
    state = createInitialState(todayISO());
    selectDate(todayISO(), false);
    save();
    toast('已回到预置的 53 条清单，从今天开始一天一条');
  }
}

function onDblClick(e) {
  var node = e.target.closest('[data-edit]');
  if (!node) return;
  e.preventDefault();
  beginEdit(node);
}

function onInput(e) {
  if (e.target.id !== 'note') return;
  var value = e.target.value;
  var date = selected;
  window.clearTimeout(noteTimer);
  noteTimer = window.setTimeout(function () {
    state = setNote(state, date, value);
    save();
  }, 300);
}

function onKeydown(e) {
  if (e.target.id === 'addInput' && e.key === 'Enter') {
    var v = e.target.value.trim();
    if (!v) { addOpen = false; renderAll(); return; }
    state = addTask(state, selected, v);
    save();
    addOpen = false;
    renderAll();
    toast('已加到这一天');
  }
}

function doExport() {
  var blob = new Blob([exportJSON(state)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '学习地图-备份-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  toast('已导出备份文件');
}

function onFileChosen(e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      state = importJSON(String(reader.result));
      addOpen = false;
      selectDate(todayISO(), false);
      save();
      toast('导入成功');
    } catch (err) {
      toast('导入失败：' + err.message);
    }
  };
  reader.onerror = function () { toast('文件读取失败'); };
  reader.readAsText(file, 'utf-8');
}

var boot = load();
state = boot.state;
selected = todayISO();
view = { year: Number(selected.slice(0, 4)), month: Number(selected.slice(5, 7)) };
renderAll();
if (boot.message) toast(boot.message);

document.addEventListener('click', onClick);
document.addEventListener('dblclick', onDblClick);
document.addEventListener('input', onInput);
document.addEventListener('keydown', onKeydown);
$('#fileInput').addEventListener('change', onFileChosen);
</script>
</body>
</html>
