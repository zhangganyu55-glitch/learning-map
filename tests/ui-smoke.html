<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>学习地图 · 界面冒烟测试（日历版）</title>
<!--
  用法（必须允许 file:// 页面互相访问，否则读不到 iframe 内部）：

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
    --no-first-run --allow-file-access-from-files --virtual-time-budget=12000 --dump-dom \
    "file:///Users/gebilaozhang/Documents/Codex/我的项目/学习地图/tests/ui-smoke.html" \
    | sed -n '/<pre id="out">/,/<\/pre>/p' | sed 's/<[^>]*>//g'

  结尾出现 TOTAL n/n 且没有 FAIL 行，就算通过。用的是临时浏览器 profile，不会碰你平时那份数据。
-->
<body>
<pre id="out">RUNNING</pre>
<iframe id="f" src="../index.html" style="width:1000px;height:900px;border:1px solid #ccc"></iframe>
<script>
const log = [];
const f = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function ok(name, cond, extra) {
  log.push((cond ? 'PASS' : 'FAIL') + ' | ' + name + (extra !== undefined ? ' | ' + extra : ''));
}
function finish() {
  document.getElementById('out').textContent =
    log.join('\n') + '\nTOTAL ' + log.filter((l) => l.startsWith('PASS')).length + '/' + log.length;
  document.title = 'DONE';
}

f.addEventListener('load', () => {
  run().catch((e) => { log.push('FAIL | 脚本抛错 | ' + e.message); finish(); });
}, { once: true });

async function run() {
  const KEY = 'learning-map-state-v2';
  const w = f.contentWindow;
  const q = (sel) => f.contentDocument.querySelector(sel);
  const qa = (sel) => Array.from(f.contentDocument.querySelectorAll(sel));
  const today = (() => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  })();
  const shift = (iso, n) => {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const cellOf = (iso) => qa('.cell').find((c) => c.dataset.date === iso);

  ok('首屏就是日历，42 个格子', qa('.cell').length === 42, qa('.cell').length);
  ok('周一在第一列', q('.dow span').textContent === '一');
  ok('今天那格有 today 标记', !!cellOf(today) && cellOf(today).classList.contains('today'));
  ok('默认选中今天，且今天有 1 件事', q('.row') && qa('.row').length === 1, qa('.row').length);
  ok('当天标题显示今天', q('#dayTitle').textContent.includes('今天'), q('#dayTitle').textContent.trim());
  ok('当天完成度显示 0/1', q('#dayNum').textContent.includes('0/1'), q('#dayNum').textContent.trim());
  ok('有任务的那天带小圆点', cellOf(today).querySelector('.dot') !== null);

  q('.row .tick').click();
  await sleep(30);
  ok('勾选后该行变完成态', q('.row').classList.contains('done'));
  ok('完成度变成 1/1', q('#dayNum').textContent.includes('1/1'), q('#dayNum').textContent.trim());
  ok('写完 localStorage', !!w.localStorage.getItem(KEY));
  ok('勾完那天的圆点变成已完成', cellOf(today).querySelector('.dot.done') !== null);

  cellOf(shift(today, 1)).click();
  await sleep(40);
  ok('点另一天会切到那天', q('#dayTitle').textContent.includes('月') && !q('#dayTitle').textContent.includes('今天'), q('#dayTitle').textContent.trim());
  ok('那天也有 1 件事（一天一条）', qa('.row').length === 1);
  ok('切到的那天被高亮', q('.cell.sel').dataset.date === shift(today, 1));

  q('#addPill').click();
  await sleep(30);
  ok('点加号出现输入框', q('#addBox').classList.contains('on'));
  q('#addInput').value = '我自己加的一件事';
  q('#addInput').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await sleep(40);
  ok('回车后任务进了这一天', qa('.row-text').some((e) => e.textContent === '我自己加的一件事'));
  ok('这天变成 2 件事', qa('.row').length === 2, qa('.row').length);
  ok('加完输入框收起来', !q('#addBox').classList.contains('on'));

  const firstText = qa('.row-text')[0].textContent;
  qa('.row')[0].querySelector('[data-act="down"]').click();
  await sleep(30);
  ok('下移按钮换了顺序', qa('.row-text')[0].textContent !== firstText);

  q('#note').value = '今天卡在异步';
  q('#note').dispatchEvent(new w.Event('input', { bubbles: true }));
  await sleep(500);
  ok('卡点写进了本地存储', JSON.parse(w.localStorage.getItem(KEY)).notes[shift(today, 1)] === '今天卡在异步');

  q('#seg [data-act="viewReview"]').click();
  await sleep(40);
  ok('切到回顾视图', !q('#viewReview').hidden && q('#viewCalendar').hidden);
  ok('连续打卡显示 1', q('#statStreak').textContent === '1', q('#statStreak').textContent);
  const savedTotal = JSON.parse(w.localStorage.getItem(KEY)).tasks.length;
  ok('累计完成显示 1/总数', q('#statDone').textContent === '1/' + savedTotal, q('#statDone').textContent);
  ok('本月完成率有数字', /%$/.test(q('#statMonth').textContent), q('#statMonth').textContent);
  ok('最近 30 天正好 30 格', qa('#mini .mini-cell').length === 30, qa('#mini .mini-cell').length);
  ok('今天那格记着 1/1', qa('#mini .mini-cell').at(-1).title.includes('1/1'), qa('#mini .mini-cell').at(-1).title);
  ok('卡点汇总里能看到刚写的卡点', qa('#notes .note-item').some((n) => n.textContent.includes('今天卡在异步')));
  ok('卡点很少时不显示「展开全部」按钮', w.getComputedStyle(q('#moreNotes')).display === 'none', w.getComputedStyle(q('#moreNotes')).display);
  const noteItem = qa('#notes .note-item')[0];
  noteItem.click();
  await sleep(40);
  ok('点卡点会跳回那一天的日历', !q('#viewCalendar').hidden && q('.cell.sel').dataset.date === noteItem.dataset.date, q('.cell.sel').dataset.date);

  qa('.row')[0].querySelector('[data-act="move"]').click();
  await sleep(30);
  const dateInput = q('.date-input');
  ok('点箭头出现换日期的输入框', !!dateInput);
  if (dateInput) {
    dateInput.value = shift(today, 10);
    dateInput.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(40);
    ok('换日期后这天只剩 1 件事', qa('.row').length === 1, qa('.row').length);
    ok('任务出现在新日期上', (cellOf(shift(today, 10)).querySelector('.dot') !== null));
  }

  const beforeDelete = qa('.row').length;
  qa('.row')[0].querySelector('[data-act="del"]').click();
  await sleep(30);
  ok('删除生效', qa('.row').length === beforeDelete - 1);
  const undo = qa('#toast button').find((b) => b.textContent === '撤销');
  ok('删除后有撤销', !!undo);
  if (undo) {
    undo.click();
    await sleep(40);
    ok('撤销后任务回来', qa('.row').length === beforeDelete, qa('.row').length);
  }

  q('.row .row-text').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true }));
  await sleep(30);
  const editInput = q('.edit-input');
  ok('双击文字出现编辑框', !!editInput);
  if (editInput) {
    editInput.value = '改过的任务';
    editInput.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await sleep(40);
    ok('回车后文字改了', qa('.row-text').some((e) => e.textContent === '改过的任务'));
  }

  const navBefore = q('#navLabel').textContent;
  q('[data-act="nextMonth"]').click();
  await sleep(30);
  ok('下一月按钮切了月份', q('#navLabel').textContent !== navBefore, navBefore + ' → ' + q('#navLabel').textContent);
  q('[data-act="prevMonth"]').click();
  await sleep(30);
  ok('上一月按钮切回来', q('#navLabel').textContent === navBefore);
  q('[data-act="today"]').click();
  await sleep(40);
  ok('回到今天', q('.cell.sel').dataset.date === today && q('#dayTitle').textContent.includes('今天'));

  const doneId = qa('.cell').find((c) => c.dataset.date === today).dataset.date;
  await new Promise((res) => { f.addEventListener('load', res, { once: true }); f.contentWindow.location.reload(); });
  await sleep(80);
  ok('刷新后今天仍是 1/1', q('#dayNum').textContent.includes('1/1'), q('#dayNum').textContent.trim());
  ok('刷新后那一格还是完成态', cellOf(doneId).querySelector('.dot.done') !== null);
  ok('刷新后挪过去的任务还在（10 天后那天）', !!cellOf(shift(today, 10)).querySelector('.dot'));

  const btn = q('#resetBtn');
  btn.click();
  await sleep(30);
  ok('重置要点两次（第一次只是确认）', btn.textContent.includes('再点一次'));
  btn.click();
  await sleep(50);
  ok('重置后回到 53 条预置清单', JSON.parse(w.localStorage.getItem(KEY)).tasks.length === 53);
  ok('重置后今天的勾选被清掉', q('#dayNum').textContent.includes('0/1'), q('#dayNum').textContent.trim());

  finish();
}
</script>
</body>
</html>
